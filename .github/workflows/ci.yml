# 素构 Plainstruct —— 推送 main 或手动触发时构建,产物作为 Artifact 留档。
# 触发方式:
#   - 推送 main 分支(构建验证与留档)
#   - 手动触发(workflow_dispatch)
# 打版本标签不再触发构建:发布 Release 时从对应提交的构建工件(Artifacts)
# 下载产物手动上传,产物命名已由流水线统一,无需改名。
#
# 产物形态:Windows x64 免安装 zip(内含 exe)、macOS arm64 dmg / zip 与
# 安卓 arm64 APK,命名统一为 Plainstruct_版本号_平台(版本取自 package.json/Cargo.toml)。
# 安卓签名:secrets ANDROID_RELEASE_KEYSTORE_B64 / ANDROID_RELEASE_KEYSTORE_PASSWORD
# 解出到 gen/android/keystore.properties;未配置时回退临时 debug 密钥(无法覆盖安装)。

name: Build Plainstruct

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest # Apple Silicon (arm64) runner
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: plainstruct-${{ matrix.os }}

      - name: Install frontend dependencies
        run: npm ci

      # Windows x64:免安装 zip(内含 exe)。脚本内部以 --no-bundle 编译,不再产出 NSIS/MSI 安装包
      - name: Build Windows x64 portable zip
        if: runner.os == 'Windows'
        run: npm run windows:portable
        shell: powershell

      # macOS arm64:只构建 .app;dmg 与 zip 由后续步骤自行打包,以注入「损坏修复」脚本
      - name: Build Tauri bundle (macOS arm64 app)
        if: runner.os == 'macOS'
        run: npm run tauri -- build --bundles app

      # ad-hoc 重签 .app:无 Apple 开发者证书无法公证,但有效的 ad-hoc 签名
      # 可避免 Gatekeeper 把应用直接判定为「已损坏」(未签名会触发更严重的拦截)。
      # 下载后的隔离属性由 dmg/zip 内的「损坏修复.command」解除。
      - name: Ad-hoc sign macOS app
        if: runner.os == 'macOS'
        run: |
          for app in src-tauri/target/release/bundle/macos/*.app; do
            if [ -e "$app" ]; then codesign --force --deep --sign - "$app"; fi
          done

      # 打包 macOS 产物:压缩包(zip,内含 .app 与「损坏修复.command」)与磁盘镜像(dmg)同名成对,
      # 统一为 Plainstruct_版本号_macOS_arm64。
      # tauri 的 dmg 不支持注入自定义文件,故先签名 .app 再用 hdiutil 重打,最后签 dmg。
      - name: Pack macOS dmg and zip with repair script
        if: runner.os == 'macOS'
        run: |
          set -e
          APP="src-tauri/target/release/bundle/macos/Plainstruct.app"
          [ -d "$APP" ]
          # 版本取自构建产物(与 tauri.conf.json/Cargo.toml 同源),产物命名不依赖触发方式
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          STAGING="$(mktemp -d)"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          cp scripts/损坏修复.command "$STAGING/损坏修复.command"
          chmod +x "$STAGING/损坏修复.command"
          BUNDLE_DIR="src-tauri/target/release/bundle/macos/Plainstruct_${VERSION}_macOS_arm64"
          hdiutil create -volname "Plainstruct" -srcfolder "$STAGING" -ov -format UDZO \
            "$BUNDLE_DIR.dmg"
          codesign --force --sign - "$BUNDLE_DIR.dmg"
          ZIP_STAGE="$(mktemp -d)"
          cp -R "$APP" "$ZIP_STAGE/"
          cp scripts/损坏修复.command "$ZIP_STAGE/损坏修复.command"
          chmod +x "$ZIP_STAGE/损坏修复.command"
          (cd "$ZIP_STAGE" && ditto -c -k --sequesterRsrc . "$GITHUB_WORKSPACE/$BUNDLE_DIR.zip")

      - name: Upload Windows x64 portable artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: plainstruct-windows-x64-portable
          path: release/Plainstruct_*_Windows_x64_Portable.zip
          if-no-files-found: error

      - name: Upload macOS arm64 artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: plainstruct-macos-arm64
          path: |
            src-tauri/target/release/bundle/macos/Plainstruct_*_macOS_arm64.dmg
            src-tauri/target/release/bundle/macos/Plainstruct_*_macOS_arm64.zip
          if-no-files-found: error

  # 安卓 APK(arm64-v8a):前端构建 + Rust 交叉编译 + gradle 打包。
  # 签名:从 secrets 解出 keystore 写入 gen/android/keystore.properties(工程内
  # build.gradle.kts 已配置读取);secrets 未配置时回退 runner 临时 debug 密钥
  # —— 仅可用于安装验证,不能覆盖安装旧版本,发版前必须配置正式密钥。
  android-apk:
    name: Android apk (arm64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: plainstruct-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Restore release keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          cd src-tauri/gen/android
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > plainstruct-release.keystore
            printf 'storeFile=plainstruct-release.keystore\nstorePassword=%s\nkeyAlias=plainstruct-release\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets ANDROID_RELEASE_KEYSTORE_B64 / ANDROID_RELEASE_KEYSTORE_PASSWORD are not set. Falling back to the runner's ephemeral debug key — this APK will NOT upgrade-install over existing releases."
          fi

      - name: Build release apk
        run: npm run android:build

      - name: Collect apk
        run: |
          mkdir -p dist
          VERSION=$(node -p "require('./package.json').version")
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -path "*release*" | head -n 1)
          if [ -z "$APK" ]; then echo "No release apk found." >&2; exit 1; fi
          cp "$APK" "dist/Plainstruct_${VERSION}_android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: plainstruct-android-apk
          path: dist/Plainstruct_*_android.apk
          if-no-files-found: error
