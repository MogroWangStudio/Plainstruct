# 素构 Plainstruct —— 推送后自动构建,产物作为 Artifact 上传。
# 触发方式:
#   - 推送 main 分支(不发布,仅构建留档)
#   - 推送版本标签(自动创建 GitHub Release 草稿并附上安装包)
#     兼容 v1.2.3 与 1.2.3 两种标签写法
#   - 手动触发(workflow_dispatch)
#
# 矩阵:Windows(NSIS/MSI 安装包 + 免安装 zip)与 macOS arm64(dmg,Apple Silicon)。

name: Build Plainstruct

on:
  push:
    branches: [main]
    tags: ["v*", "[0-9]*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest # Apple Silicon (arm64) runner
    runs-on: ${{ matrix.os }}
    env:
      # 版本号取自已打的标签,未打标签时回退到 dev
      APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: plainstruct-${{ matrix.os }}

      - name: Install frontend dependencies
        run: npm ci

      # Windows:NSIS 安装包与 MSI(WebView2 采用 embedBootstrapper,安装时自动引导)
      - name: Build Tauri bundles (Windows)
        if: runner.os == 'Windows'
        run: npm run tauri -- build

      # 基于上一步的 release 可执行文件打免安装版 zip(脚本内部 --no-bundle,增量极快)
      - name: Build portable zip
        if: runner.os == 'Windows'
        run: npm run windows:portable
        shell: powershell

      # macOS arm64:只构建 .app;dmg 由下一步自行打包,以注入「损坏修复」脚本
      - name: Build Tauri bundle (macOS arm64 app)
        if: runner.os == 'macOS'
        run: npm run tauri -- build --bundles app

      # ad-hoc 重签 .app:无 Apple 开发者证书无法公证,但有效的 ad-hoc 签名
      # 可避免 Gatekeeper 把应用直接判定为「已损坏」(未签名会触发更严重的拦截)。
      # 下载后的隔离属性由 dmg 内的「损坏修复.command」解除。
      - name: Ad-hoc sign macOS app
        if: runner.os == 'macOS'
        run: |
          for app in src-tauri/target/release/bundle/macos/*.app; do
            if [ -e "$app" ]; then codesign --force --deep --sign - "$app"; fi
          done

      # 自打 dmg:应用 + Applications 快捷方式 + 「损坏修复」脚本。
      # tauri 的 dmg 不支持注入自定义文件,故先签名 .app 再用 hdiutil 重打,最后签 dmg。
      - name: Pack macOS dmg with repair script
        if: runner.os == 'macOS'
        run: |
          set -e
          APP="src-tauri/target/release/bundle/macos/Plainstruct.app"
          [ -d "$APP" ]
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")
          STAGING="$(mktemp -d)"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          cp scripts/损坏修复.command "$STAGING/损坏修复.command"
          chmod +x "$STAGING/损坏修复.command"
          DMG="src-tauri/target/release/bundle/dmg/Plainstruct_${VERSION}_aarch64.dmg"
          mkdir -p "$(dirname "$DMG")"
          hdiutil create -volname "Plainstruct" -srcfolder "$STAGING" -ov -format UDZO "$DMG"
          codesign --force --sign - "$DMG"

      - name: Upload Windows installer artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: plainstruct-windows-installer
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload Windows portable artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: plainstruct-x64-portable
          path: release/Plainstruct-x64-portable.zip
          if-no-files-found: warn

      - name: Upload macOS arm64 artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: plainstruct-macos-arm64-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  # 推送版本标签时,汇总两个平台的产物创建 Release 草稿
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Plainstruct ${{ github.ref_name }}
          body: |
            自动构建的 Plainstruct ${{ github.ref_name }} 安装包。

            - Windows:NSIS 安装包与免安装版(zip);WebView2 采用 embedBootstrapper,安装时自动引导,无需预装运行库
            - macOS:Apple Silicon (arm64) 磁盘镜像(dmg)。应用为开源软件,采用 ad-hoc 签名、未经 Apple 公证,首次打开若提示「已损坏」,双击镜像内的「损坏修复.command」并输入开机密码(仅用于移除隔离标记)即可正常安装打开;也可在终端手动执行(装到「应用程序」后):
              `sudo xattr -r -d com.apple.quarantine /Applications/Plainstruct.app`
          files: |
            artifacts/**/*.exe
            artifacts/**/*.msi
            artifacts/**/*.zip
            artifacts/**/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
